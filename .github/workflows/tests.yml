name: Tests

run-name: ${{ github.event_name == 'pull_request' && format('Tests for PR #{0}', github.event.pull_request.number) || format('Tests on {0}', github.ref_name) }}

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check unused code and dependencies
        run: npm run knip

      - name: Run tests with enforced coverage
        run: npm run test:coverage

      - name: Write test summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          NODE_VERSION: ${{ matrix.node-version }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          {
            echo "## Tests on Node ${NODE_VERSION}"
            echo ""
            echo "- Event: \`${EVENT}\`"
            echo "- Ref: \`${REF}\`"
            echo "- Commit: [\`${SHORT_SHA}\`](${SERVER_URL}/${REPO}/commit/${SHA})"
            echo "- Lint: \`npm run lint\`"
            echo "- Unused code: \`npm run knip\`"
            echo "- Tests and 100% source coverage: \`npm run test:coverage\`"
          } >> "$GITHUB_STEP_SUMMARY"
