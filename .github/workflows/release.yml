name: Release

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0} from develop', inputs.bump) || 'Release from main' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump on develop, then publish from main
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha: ${{ steps.push_main.outputs.sha || steps.pkg.outputs.sha }}
      published: ${{ steps.npm.outputs.published }}
    steps:
      - name: Require develop for version bumps
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        run: |
          echo "Run this workflow from the develop branch. Selected ref: ${{ github.ref }}"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.run_attempt == '1' && 'develop' || 'main') || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION}"

      - name: Resolve package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "## Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit to main
        id: push_main
        if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
        run: |
          git fetch origin main
          git merge origin/main --no-edit -m "chore: merge main into release v${{ steps.pkg.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check if version is already on npm
        id: npm
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "sequelize-jest-kit@${VERSION}" version 2>/dev/null | grep -q .; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-and-sync:
    name: Publish & Sync v${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: needs.prepare.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts

      - name: Check GitHub release
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.gh_release.outputs.exists == 'false' && (needs.prepare.outputs.published == 'false' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          generate_release_notes: true

      - name: Merge main into develop and push
        if: needs.prepare.outputs.published == 'false' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B develop origin/develop
          git merge origin/main --no-edit -m "chore: sync develop with main after v${{ needs.prepare.outputs.version }}"
          git push origin develop
