name: Release

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Queue {0} release', inputs.bump) || 'Publish from main' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for a release PR from develop to main
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    name: Create release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Require develop for version bumps
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "Run this workflow from the develop branch. Selected ref: ${{ github.ref }}"
          exit 1

      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Create version bump
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          npm exec -- biome format --write package.json
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v${VERSION}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch ${BRANCH} already exists; reusing it."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION}"
          git push origin "$BRANCH"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$PR_COUNT" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: release v${VERSION}" \
              --body "Version bump for v${VERSION}. Merge after all required checks pass."
          fi
          gh workflow run tests.yml --ref "$BRANCH"
          {
            echo "## Release v${VERSION} queued"
            echo ""
            echo "A protected pull request from \`${BRANCH}\` to \`main\` is ready for review."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify release commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.npm.outputs.published }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

      - name: Resolve package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version is already on npm
        id: npm
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "sequelize-jest-kit@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish v${{ needs.verify.outputs.version }}
    if: needs.verify.outputs.published == 'false'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Publish verified commit to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "sequelize-jest-kit@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} reached npm during an earlier attempt; skipping duplicate publish."
            exit 0
          fi
          npm publish --ignore-scripts --provenance

  finalize:
    name: Finalize v${{ needs.verify.outputs.version }}
    if: always() && needs.verify.result == 'success' && (needs.verify.outputs.published == 'true' || needs.publish.result == 'success')
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --target "$SHA" \
              --title "v${VERSION}" \
              --generate-notes
          fi

      - name: Open main-to-develop sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main."
            exit 0
          fi
          BRANCH="sync/main-after-v${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" origin/develop
          fi
          git merge origin/main --no-edit -m "chore: sync develop with main after v${VERSION}"
          git push origin "$BRANCH"
          PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$PR_COUNT" -eq 0 ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore: sync main after v${VERSION}" \
              --body "Sync the verified v${VERSION} release commit back into develop."
          fi
          gh workflow run tests.yml --ref "$BRANCH"
          gh workflow run codeql-analysis.yml --ref "$BRANCH"

      - name: Write release summary
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          {
            echo "## Released v${VERSION}"
            echo ""
            echo "- Commit: [\`${SHORT_SHA}\`](${SERVER_URL}/${REPO}/commit/${SHA})"
            echo "- npm: [sequelize-jest-kit@${VERSION}](https://www.npmjs.com/package/sequelize-jest-kit/v/${VERSION})"
            echo "- GitHub: [v${VERSION}](${SERVER_URL}/${REPO}/releases/tag/v${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"
